name: Preview

# `npm run share` force-pushes the working tree to the `preview` branch; this builds it with
# drafts included and publishes it to Cloudflare Pages. Nothing here can reach ajay.guru:
# a separate host, `Disallow: /` for robots, and no sitemap.
on:
  push:
    branches: [preview]
  workflow_dispatch:

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_PROJECT: ajay-guru-preview
      # Set the PREVIEW_SITE repository variable to https://preview.ajay.guru once the custom
      # domain is on the Pages project; until then the build points at the pages.dev URL.
      PREVIEW_SITE: ${{ vars.PREVIEW_SITE || 'https://ajay-guru-preview.pages.dev' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install D2 (diagrams are rendered at build time)
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s -- --version v0.8.1 --prefix "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build, drafts included
        run: DRAFTS=1 npm run build
      - name: Keep the preview out of search results and off the domain
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          rm -f dist/CNAME dist/sitemap-index.xml dist/sitemap-*.xml
      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          wrangler() { npx --yes wrangler@4 "$@"; }
          # First run creates the project; `preview` is its production branch, so every share
          # lands on one stable URL instead of a new per-commit one.
          wrangler pages project list | grep -qw "$CF_PROJECT" \
            || wrangler pages project create "$CF_PROJECT" --production-branch=preview
          wrangler pages deploy dist --project-name="$CF_PROJECT" --branch=preview --commit-dirty=true
          echo "### Preview → $PREVIEW_SITE" >> "$GITHUB_STEP_SUMMARY"
      - name: No Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Built, but CLOUDFLARE_API_TOKEN is not set — nothing was published."
